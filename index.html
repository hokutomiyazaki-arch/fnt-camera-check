<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カメラでチェック（試し版）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0f1115;color:#f2f2f2;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:6px 0}
p{margin:6px 0;font-size:15px}
.small{font-size:12.5px;color:#aab}
button{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;padding:14px;width:100%;margin:5px 0;background:#2a6df4;color:#fff;cursor:pointer}
button.sub{background:#2b2f38}
button:disabled{opacity:.4}
.res{background:#1b1f27;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.res b{color:#ffd166}
.judge{background:#3a1f24;border:1px solid #ff8a65}
textarea{width:100%;height:160px;background:#1b1f27;color:#eee;border:1px solid #333;border-radius:8px;font-size:12px;padding:8px}
.hide{display:none!important}
/* テストの画面：画面いっぱい。指示はいつも真ん中に太く大きく */
#sMain{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;inset:0}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1);transition:opacity .3s}
/* 顔の点・∞は、画面の大きさのキャンバスに JS で映像と同じ位置・鏡写しで描く（キャンバスの object-fit と反転は Android で位置がずれた） */
#overlay{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s}
#stage.dark video{opacity:.10}#stage.dark #overlay{opacity:0}
#sMain.dark #top{opacity:.25}
#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 12px 14px;background:linear-gradient(rgba(0,0,0,.65),transparent);z-index:6;pointer-events:none}
#title{font-size:14px;font-weight:700;color:#cfd3dc}
.steps{display:flex;gap:3px;margin:0 0 4px}.steps span{flex:1;height:4px;border-radius:2px;background:#2b2f38}.steps span.on{background:#2a6df4}
#cue{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);text-align:center;font-weight:800;font-size:clamp(23px,6.6vw,34px);line-height:1.45;padding:16px 16px;border-radius:18px;background:rgba(0,0,0,.62);text-shadow:0 2px 8px #000;pointer-events:none;z-index:5}
#cue:empty{display:none}
/* 的のすぐ下に出す案内とボタン（寄り目）。始めたらすぐ消す */
#near{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,520px);text-align:center;font-weight:800;font-size:clamp(19px,5.4vw,26px);line-height:1.45;padding:12px 14px 8px;border-radius:16px;background:rgba(0,0,0,.72);z-index:9;display:none}
#near small{display:block;font-size:15px;font-weight:600;color:#dfe3ea;margin-top:6px;line-height:1.5}
#cue.thin{background:none}
#cue.low{top:68%}
#cue.huge{font-size:clamp(60px,22vw,110px)}
#cue small{display:block;font-size:16px;font-weight:600;color:#dfe3ea;margin-top:8px;line-height:1.5}
#cue .ok{display:inline-block;color:#5ad18b;font-size:1.5em}
.meter{position:relative;height:16px;border-radius:8px;background:#2b2f38;margin:12px 4px 2px;overflow:hidden}
.meter i{position:absolute;top:0;bottom:0;background:rgba(90,209,139,.45)}
.meter b{position:absolute;top:-2px;width:6px;height:20px;margin-left:-3px;background:#fff;border-radius:3px}
.tgt{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#ffcc00;box-shadow:0 0 14px #ffcc00;display:none;pointer-events:none;z-index:7}
.tgt.fix{width:22px;height:22px;margin:-11px 0 0 -11px;background:radial-gradient(#000 0 22%,#ffcc00 24%)}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75) 30%);z-index:8;max-height:62vh;overflow:auto}
#bottom:not(:has(*:not(:empty))){background:none}
#msg{font-size:12.5px;color:#aab;text-align:center;min-height:0}
#photoWrap{position:absolute;inset:0;display:none;z-index:4;background:#000}
#photo{width:100%;height:100%;object-fit:contain}
#camFix{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:auto;background:#e8590c}
.badge{position:fixed;right:8px;top:calc(6px + env(safe-area-inset-top));font-size:11px;background:#7a3cff;color:#fff;border-radius:6px;padding:1px 6px;z-index:20}
</style>
</head>
<body>
<main>
<div id="sIntro">
  <h1>カメラでチェック（試し版）</h1>
  <p>カメラで顔と目の動きを読み取ります。画面の真ん中に出る指示のとおりに、顔や目を動かしてください。</p>
  <div class="res small">
    ・映像も写真も、この端末の外へは送りません（端末の中で数字にするだけです）。<br>
    ・医療の検査ではありません。痛み・めまい・気分の悪さが出たら、すぐにやめてください。<br>
    ・明るい所でやってください。目のチェックでは、スマホを顔に近づけて持ちます。
  </div>
  <p id="loadState" class="small">読み込み中…</p>
  <button id="bStart" disabled>カメラを起動する</button>
</div>

<div id="sEnd" class="hide">
  <h1>おつかれさまでした</h1>
  <p id="endLead">すべてのチェックが終わりました。</p>
  <div id="endList"></div>
  <div id="staffEnd" class="hide">
    <p class="small">ここから下はスタッフ用です（お客さんの画面には出ません）。下の［コピー］で記録をそのままチャットに貼れます。</p>
    <textarea id="endText" readonly></textarea>
    <button id="bCopy">コピー</button>
    <button class="sub" id="bCopyAll">この端末に残っている記録を全部コピー</button>
  </div>
  <button class="sub" id="bAgain">最初からもう一度</button>
</div>
</main>

<div id="sMain" class="hide">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <canvas id="guide"></canvas>
    <div id="photoWrap"><canvas id="photo"></canvas></div>
    <div class="tgt" id="dot"></div>
  </div>
  <div id="top"><div class="steps" id="steps"></div><div id="title"></div></div>
  <div id="cue"></div>
  <div id="near"></div>
  <div id="bottom"><div id="result"></div><div id="btns"></div><div id="msg"></div></div>
</div>

<script type="module">
import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/vision_bundle.mjs';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = id => document.getElementById(id);
const video = $('video'), ov = $('overlay'), oc = ov.getContext('2d'), gd = $('guide'), gc = gd.getContext('2d');
let lm = null, last = null, lastBs = null, lastT = -1, rec = null, grab = null;   // last = 直近の顔の点（画素）
const sleep = ms => new Promise(r => setTimeout(r, ms));
// スタッフ表示（?staff=1）：判定と数字を出す。お客さんの画面（ふつうの URL）には判定も数字も出さず、記録だけ残す（2026-10-14 宮崎さん）
const STAFF = /[?&]staff\b/.test(location.search);
if (STAFF) document.body.insertAdjacentHTML('beforeend', '<div class="badge">スタッフ表示</div>');
let RUN = {};                                       // この回の記録（内部用）。最後に端末へ保存する
const newRun = () => { RUN = { v: 2, started: new Date().toISOString(), ua: navigator.userAgent }; };
newRun();

// ── 顔の点の番号（右・左は本人から見た向き。起動後に実際の位置で確かめて入れ替える）
let P = { eyeOut: [33, 263], eyeIn: [133, 362], mouth: [61, 291], brow: [105, 334], lidUp: [159, 386], lidDn: [145, 374], iris: [468, 473], cheek: [234, 454] };
let sideChecked = false;
const BSN = ['eyeLookInLeft', 'eyeLookOutLeft', 'eyeLookUpLeft', 'eyeLookDownLeft', 'eyeLookInRight', 'eyeLookOutRight', 'eyeLookUpRight', 'eyeLookDownRight', 'eyeBlinkLeft', 'eyeBlinkRight', 'jawOpen', 'tongueOut'];
// GPU で顔の点が取れない端末がある（Android の Chrome で、顔が映っていても点が出なかった）。取れない・エラーが続いたら CPU に切り替える
let delegate = '', toCPU = async () => {}, switching = false, gpuMiss = 0;

async function load() {
  const fs = await FilesetResolver.forVisionTasks(WASM);
  const opt = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true });
  try { lm = await FaceLandmarker.createFromOptions(fs, opt('GPU')); delegate = 'GPU'; }
  catch (e) { lm = await FaceLandmarker.createFromOptions(fs, opt('CPU')); delegate = 'CPU'; }
  toCPU = async () => { if (delegate === 'CPU' || switching) return; switching = true; try { lm = await FaceLandmarker.createFromOptions(fs, opt('CPU')); delegate = 'CPU'; } finally { switching = false; } };
  window.__lm = lm;
  $('loadState').textContent = '準備ができました。';
  $('bStart').disabled = false;
}
load().catch(e => { $('loadState').textContent = '読み込みに失敗しました：' + e.message; window.__loadError = e.message; });

// ── 計算の道具
function px(l) { return { x: l.x * video.videoWidth, y: l.y * video.videoHeight }; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
const med = a => { if (!a.length) return NaN; const v = [...a].sort((x, y) => x - y), n = v.length >> 1; return v.length % 2 ? v[n] : (v[n - 1] + v[n]) / 2; };
const mad = a => { const m = med(a); return med(a.map(x => Math.abs(x - m))); };
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => { const m = Math.max(Math.abs(a), Math.abs(b)); return m < 1e-6 ? 0 : Math.round(Math.abs(a - b) / m * 100); };
const f2 = v => Number.isFinite(v) ? (Math.round(v * 100) / 100).toFixed(2) : '—';
const r0 = v => Number.isFinite(v) ? Math.round(v) : null;
const r3 = v => Number.isFinite(v) ? Math.round(v * 1000) / 1000 : null;
function sideWord(r, l, big = '大きい') { if (Math.max(r, l) < 0.02) return '動きが小さく、比べられませんでした'; if (pct(r, l) < 15) return '左右ほぼ同じ'; return (r > l ? '右' : '左') + 'のほうが' + big; }

// 目の線を水平に回して、目の間の長さを1にした座標（顔の傾き・カメラとの距離に左右されない）。
// x は「本人の右 → 本人の左」が＋（写っている映像のまま。鏡にしていない）
function frame(pts) {
  const a = pts[P.eyeOut[0]], b = pts[P.eyeOut[1]];
  const c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, d = dist(a, b);
  let ang = Math.atan2(b.y - a.y, b.x - a.x);
  if (ang > Math.PI / 2) ang -= Math.PI; else if (ang < -Math.PI / 2) ang += Math.PI;
  const cs = Math.cos(-ang), sn = Math.sin(-ang);
  const f = p => { const x = p.x - c.x, y = p.y - c.y; return { x: (x * cs - y * sn) / d, y: (x * sn + y * cs) / d }; };
  const ci = Math.cos(ang), si = Math.sin(ang);
  const inv = q => ({ x: c.x + (q.x * ci - q.y * si) * d, y: c.y + (q.x * si + q.y * ci) * d });
  return { f, inv, d, ang, c };
}
// 目の大きさ（目じり〜目がしらの長さ）を、映像の短い辺で割った値。スマホを顔に近づけるほど大きくなる
const eyeSize = pts => (dist(pts[P.eyeOut[0]], pts[P.eyeIn[0]]) + dist(pts[P.eyeOut[1]], pts[P.eyeIn[1]])) / 2 / Math.min(video.videoWidth, video.videoHeight);
const EYE_OK = [0.13, 0.20];   // 目のチェックで「OK」とする目の大きさ（仮。宮崎さんの端末の記録で詰める）

// ── カメラ
let camWanted = false, camErr = '';   // 一度つけたら、このページを閉じるまでカメラを保つ
async function startCam() {
  camWanted = true;
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
  video.srcObject = s;
  await video.play();
  s.getVideoTracks()[0].addEventListener('ended', () => reviveCam('ended'));
  wake();
  RUN.cam = { w: video.videoWidth, h: video.videoHeight, screen: [innerWidth, innerHeight, window.devicePixelRatio || 1], fpsSetting: s.getVideoTracks()[0]?.getSettings?.().frameRate || null, settings: (() => { const g = s.getVideoTracks()[0]?.getSettings?.() || {}; return { w: g.width, h: g.height }; })() };
  if (!looping) { looping = true; loop(); }
}
// しばらく置くと、画面が消えたり別のアプリに移ったりしてカメラが止まる（2026-10-14 宮崎さん「しばらく放置したらカメラが起動しなくなった」）。
// 戻ってきたとき・映像が2秒止まったとき・カメラが切れたときに、カメラを開き直す。測っている段はそのまま続く
let looping = false, reviving = false, stillSince = 0, wl = null;
async function wake() { try { if (navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {} }   // 使っている間は画面を消さない
// 2026-10-14 2回目「カメラが起動しなくなった」：開き直しが3回とも失敗すると、映像が空のまま二度と開き直さず、
// 「読み込み直して」としか出なかった（Android は画面に戻った直後や、押す操作なしではカメラを開けないことがある）。
// 失敗したら「カメラをつけ直す」ボタンを出し、押せばその場で開き直して、測っている段から続ける。戻ってきたときにも再挑戦する
const camOK = () => { const t = video.srcObject && video.srcObject.getVideoTracks()[0]; return !!(t && t.readyState === 'live' && !t.muted); };
function camFixBtn(show) {
  let b = $('camFix');
  if (!show) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('button'); b.id = 'camFix'; document.body.appendChild(b);
    b.onclick = async () => { b.disabled = true; b.textContent = 'カメラをつけています…'; try { await startCam(); camErr = ''; camFixBtn(false); } catch (e) { camErr = e.name || String(e); camFixBtn(true); } }; }
  b.disabled = false; b.textContent = 'カメラが止まりました。ここを押してつけ直す' + (camErr ? `（${camErr}）` : '');
}
async function reviveCam(why) {
  if (reviving || !camWanted || document.hidden) return;
  reviving = true; window.__revive = (window.__revive || 0) + 1; window.__reviveWhy = why;
  let ok = false;
  for (let i = 0; i < 3 && !ok; i++) { try { await startCam(); camErr = ''; ok = true; } catch (e) { camErr = e.name || String(e); window.__camErr = camErr; await sleep(1000); } }
  camFixBtn(!ok);
  stillSince = 0; reviving = false;
}
// 2026-10-14 3回目「一回閉じるとカメラが起動しなくなる」：画面を離れてもカメラを持ったままだったので、
// Android では裏に残ったこのページがカメラを握り、開き直した新しいページがカメラを開けなかった。
// 画面を離れたら（隠れた・閉じた）すぐカメラを手放し、戻ったら開き直す
function releaseCam() { if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; } stillSince = 0; }
addEventListener('pagehide', releaseCam);
addEventListener('pageshow', e => { if (e.persisted && camWanted) reviveCam('pageshow'); });
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { releaseCam(); return; }
  if (!camWanted) return;
  wake(); await sleep(400);   // 戻った直後はカメラを開けない端末があるので、少し待つ
  if (!camOK()) reviveCam('back'); else video.play().catch(() => reviveCam('play'));
});
// 顔の点のキャンバスを画面の大きさ（×画素密度）にして、映像の画素の座標で描けるように変換をかける。
// 映像は object-fit:contain＋鏡写しで出ているので、同じ位置・同じ倍率・左右反転にそろえる
let OVU = 1;
// 顔の読み取りには、映像をいったん映像と同じ大きさのキャンバスに写してから渡す。
// Android の Chrome で video をそのまま渡すと、顔の点が映像より約1.5倍に広がり左下へずれた（2026-10-14 宮崎さんのスクショ）。
// キャンバスに写せば、点の位置は必ずこのキャンバス（＝videoWidth×videoHeight）の上の位置になる
const detC = document.createElement('canvas'), detX = detC.getContext('2d');
function frameCanvas() {
  const w = video.videoWidth, h = video.videoHeight;
  if (detC.width !== w || detC.height !== h) { detC.width = w; detC.height = h; }
  detX.drawImage(video, 0, 0, w, h);
  return detC;
}
function fitOverlay() {
  const W = ov.clientWidth, H = ov.clientHeight, r = window.devicePixelRatio || 1, vw = video.videoWidth, vh = video.videoHeight;
  const cw = Math.round(W * r), ch = Math.round(H * r);
  if (ov.width !== cw || ov.height !== ch) { ov.width = cw; ov.height = ch; }
  oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, cw, ch);
  if (!vw || !vh || !W || !H) return;
  const k = Math.min(W / vw, H / vh), ox = (W - vw * k) / 2, oy = (H - vh * k) / 2;
  oc.setTransform(-k * r, 0, 0, k * r, (ox + vw * k) * r, oy * r);
  OVU = 1 / k;
}
const grabC = document.createElement('canvas'), grabX = grabC.getContext('2d', { willReadFrequently: true });
function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    const t = performance.now();
    let r = null;
    if (!switching) { try { r = lm.detectForVideo(frameCanvas(), t); } catch (e) { window.__detErr = e.message; toCPU(); } }
    const got = !!(r && r.faceLandmarks && r.faceLandmarks[0]);
    gpuMiss = got ? 0 : gpuMiss + 1;
    if (delegate === 'GPU' && gpuMiss > 45) toCPU();   // GPU で約3秒続けて顔が取れなければ、CPU に切り替える（一度だけ）
    window.__delegate = delegate;
    fitOverlay();
    if (got) {
      const pts = r.faceLandmarks[0].map(px);
      if (!sideChecked) {   // 写っている映像（鏡にしていない）では、本人の右は画面の左＝x が小さい
        if (pts[33].x > pts[263].x) for (const k in P) P[k] = [P[k][1], P[k][0]];
        sideChecked = true;
      }
      let bs = null;
      const cat = r.faceBlendshapes && r.faceBlendshapes[0] && r.faceBlendshapes[0].categories;
      if (cat) { bs = {}; for (const c of cat) if (BSN.includes(c.categoryName)) bs[c.categoryName] = c.score; }
      last = pts; lastBs = bs; window.__last = pts;
      const u = OVU;   // 画面の 1px が映像の何画素か（点の大きさを画面の上でそろえる）
      oc.fillStyle = 'rgba(90,209,139,.9)';
      for (let i = 0; i < pts.length; i += 2) oc.fillRect(pts[i].x - 1.3 * u, pts[i].y - 1.3 * u, 2.6 * u, 2.6 * u);
      oc.fillStyle = '#ffcc00';
      for (const i of [...P.iris, 1]) { oc.beginPath(); oc.arc(pts[i].x, pts[i].y, 3.5 * u, 0, 7); oc.fill(); }
      if (rec) rec.push({ t, pts, bs });
      if (grab && t - grab.lastT >= (grab.every || 200)) {   // 舌：写真のコマを取っておく（端末の中だけ）
        grabC.width = video.videoWidth; grabC.height = video.videoHeight; grabX.drawImage(video, 0, 0);
        const img = grabX.getImageData(0, 0, grabC.width, grabC.height);
        if (grab.proc) { const m = grab.proc(pts, img); grab.fr.push({ t, m }); if (m && m.ok) grab.img = { img, pts }; }   // 瞳孔：その場で測って、写真は最後の1枚だけ持つ（大きい写真を何枚も持たない）
        else grab.fr.push({ t, pts, bs, img });
        grab.lastT = t;
      }
      if (G) drawGuide(t, pts);
    } else { last = null; lastBs = null; if (G) drawGuide(t, null); }
    if (STAFF && window.__frames % 30 === 0) document.querySelector('.badge').textContent = `スタッフ表示 ${video.videoWidth}×${video.videoHeight} ${delegate}`;   // ずれたときの手がかり
    window.__frames = (window.__frames || 0) + 1;
    window.__faceSeen = (window.__faceSeen || 0) + (last ? 1 : 0);
  }
  // カメラが切れた・止まったまま（映像が止まっても currentTime は進むことがあるので、カメラそのものの状態を見る）

  staff(`真顔の下がり：口角 ${Math.abs(res.mouthDrop) < 0.005 ? 'ほぼ同じ' : LR(res.mouthDrop) + 'が下 ' + f2(Math.abs(res.mouthDrop))}・眉 ${Math.abs(res.browDrop) < 0.005 ? 'ほぼ同じ' : LR(res.browDrop) + 'が下 ' + f2(Math.abs(res.browDrop))}<br>

  口角の上がり：右 <b>${f2(res.m0)}</b>・左 <b>${f2(res.m1)}</b> → ${sideWord(res.m0, res.m1, 'よく上がる')}（差 ${pct(res.m0, res.m1)}%）<br>
  眉の上がり：右 <b>${f2(res.b0)}</b>・左 <b>${f2(res.b1)}</b> → ${sideWord(res.b0, res.b1, 'よく上がる')}（差 ${pct(res.b0, res.b1)}%）<br>
  目の閉じ方：右 <b>${Math.round(res.e0 * 100)}%</b>・左 <b>${Math.round(res.e1 * 100)}%</b> → ${sideWord(res.e0, res.e1, 'よく閉じる')}
  <div class="res judge">内部の読み（仮）：${C7.side ? `<b>${C7.side}の顔面神経</b>の働き低下の可能性 — ${C7.items.map(i => i.why).join('・')}` : C7.mixed ? `左右がまちまち — ${C7.items.map(i => i.why).join('・')}` : '目立った左右差なし'}<br><span class="small">下がりは目の間の長さを1として ${DROOP} 以上・しわは増えた本数の差 ${WRK_GAP}% 以上（どちらも仮）。しわは照明の当たり方で左右差が出ることがある</span></div>`);

// ════ 目のチェックの共通部品
// 近さの確認：目がどれだけ大きく映っているかで判定し、ちょうどいい近さで「OK ✓」を出す（2026-10-14 宮崎さん）
async function gate() {
  const my = tok, t0 = performance.now(); let ok = 0, skipped = false, done = false;
  dark(false);
  const sk = btn('この近さのまま進む', () => { skipped = true; }, 'sub'); sk.style.display = 'none';
  while (my === tok && !done && !skipped) {
    let html;
    if (!last) html = '顔が見えません<small>スマホを顔の正面に持ってください</small>';
    else {
      const v = eyeSize(last), good = v >= EYE_OK[0] && v <= EYE_OK[1];
      const lo = 0.04, hi = 0.26, pos = clamp((v - lo) / (hi - lo), 0, 1) * 100;
      const zone = `<div class="meter"><i style="left:${(EYE_OK[0] - lo) / (hi - lo) * 100}%;width:${(EYE_OK[1] - EYE_OK[0]) / (hi - lo) * 100}%"></i><b style="left:${pos}%"></b></div>`;
      html = (good ? '<span class="ok">OK ✓</span><br>この近さのまま' : v < EYE_OK[0] ? 'スマホを<br>顔に近づけて' : '少し<br>離して') + zone +
        '<small>目が大きく映るまで近づけます（目安：顔から20〜25cm）。緑の帯に白い線が入ればOK</small>';
      ok = good ? ok + 1 : 0;
      if (ok >= 7) done = true;      // 150ms × 7 ≒ 1秒、続けて OK
    }
    cue(html);
    sk.style.display = !done && last && performance.now() - t0 > 7000 ? '' : 'none';   // 止まり続けないように、7秒で逃げ道を出す
    await sleep(150);
  }
  sk.remove();
  if (done) { cue('<span class="ok">OK ✓</span><br>この近さのまま'); await sleep(800); }
  return { eye: last ? r3(eyeSize(last)) : null, ok: done };
}
// 1コマから目の特徴を取る。右目（s=0）・左目（s=1）は本人の向き
function eyeFeat(pts) {
  const { f } = frame(pts), o = {};
  for (const s of [0, 1]) {
    const a = f(pts[P.eyeOut[s]]), b = f(pts[P.eyeIn[s]]), c = f(pts[P.iris[s]]), w = dist(a, b), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

    o['vy' + s] = (c.y - m.y) / w;   // ＋＝下へ

}

    bsX: (b('eyeLookOutRight') + b('eyeLookInLeft') - b('eyeLookInRight') - b('eyeLookOutLeft')) / 2,
    vy: -(e.vy0 + e.vy1) / 2,                                                                                      // ＋＝上を見る
    ap: (e.ap0 + e.ap1) / 2,

}
// 目の合わせ（5か所の点を見る）：一人ひとりの「黒目の位置 → 画面のどこを見ているか」の換算を作る。

  return fr.map(o => {
    const F = feats(o), X = (F[CAL.x.nm] - CAL.x.mc) / CAL.x.slope, Y = (F[CAL.y.nm] - CAL.y.mc) / CAL.y.slope;

async function calibrate() {
  const my = tok; dark(true);
  cue('出てくる点を<br><b>目だけで</b>見てください<small>頭は動かさずに。点が5か所に出ます</small>'); await sleep(2600); cue('');
  const segs = [];
  for (const [k, x, y] of [['C', 0, 0], ['R', 1, 0], ['L', -1, 0], ['U', 0, 1], ['D', 0, -1], ['C2', 0, 0]]) {

  }

  const c = fitCalib(segs);

  if (!CAL || !CAL.ok) { CAL = await calibrate(); if (!CAL) return null; if (!CAL.ok) { fail(again, '目の位置を読み取れませんでした'); return null; } }
  return g;
}

// ════ 3. 目の準備（近づける → 合わせる）
async function stepEyePrep() {
  show(5, '5. 目の準備（測る前の合わせ）');
  cue('ここからは目のチェックです<small>これは検査ではなく、<b>目の動きを正しく測るための準備</b>です。スマホを手に持って顔に近づけ、「OK ✓」が出たら、5か所に出る点を目だけで見てください。人によって黒目の見え方が違うので、黒目の位置と画面の位置を一人ずつ対応させます</small>');
  btn('始める', async () => {
    clearBtns(); CAL = null;
    const g = await gate();
    CAL = await calibrate(); if (!CAL) return;
    if (CAL.ok && !CAL.reliable) { cue('もう一度<br>合わせます<small>頭を動かさずに、目だけで点を見てください</small>'); await sleep(2200); const c2 = await calibrate(); if (!c2) return; if (c2.ok && (!CAL.ok || c2.x.sep + c2.y.sep > CAL.x.sep + CAL.y.sep)) CAL = c2; RUN.calib = { x: CAL.x, y: CAL.y, reliable: CAL.reliable, apRef: r3(CAL.apRef), frames: CAL.frames, retried: true }; }
    RUN.eyeGate = g;
    if (!CAL.ok) return fail(stepEyePrep, '目の位置を読み取れませんでした');
    dark(false);
    staff(`近さ（目の大きさ）<b>${f2(g.eye)}</b>${g.ok ? '' : '（OK になる前に進んだ）'}<br>横：<b>${CAL.x.nm}</b>（見分け ${CAL.x.sep}${CAL.x.mono ? '' : '・順番が崩れた'}）　たて：<b>${CAL.y.nm}</b>（見分け ${CAL.y.sep}${CAL.y.mono ? '' : '・順番が崩れた'}）<br><span class="small">見分けが ${CAL_MIN} 未満だと、目の位置の読み取りが不安定（そのときは判定しない）。もう一度やり直すと良くなることがあります</span>`);
    recorded(stepEyePrep, stepPursuit, '次へ（点を目で追う）');
  });
}

// ════ 4. 追従（スムーズパースート）：よこ・たて・ななめ2つ。1往復 3.2秒 × 2往復
const PT = 3200, PC = 2;
const PUR = [{ k: 'よこ', v: [1, 0] }, { k: 'たて', v: [0, 1] }, { k: 'ななめ（右上↔左下）', v: [1, 1] }, { k: 'ななめ（左上↔右下）', v: [-1, 1] }];
async function stepPursuit() {
  show(6, '6. 点を目で追う');
  cue('ゆっくり動く点を<br><b>頭を動かさずに目だけで</b><br>追ってください<small>よこ → たて → ななめ → ななめ の順。約35秒</small>');
  btn('始める', async () => {
    const my = tok; clearBtns();
    const g = await eyeStepStart(stepPursuit); if (!g) return;
    dark(true); const segs = [];
    for (const s of PUR) {
      if (my !== tok) return;
      placeDot(0, 0); cue(`次は<br><b>${s.k}</b>`, 'low'); await sleep(1800); cue('');
      const t0 = performance.now();
      const fr = await record(PT * PC, () => { const a = Math.sin(2 * Math.PI * (performance.now() - t0) / PT); placeDot(s.v[0] * a, s.v[1] * a); });
      segs.push({ k: s.k, v: s.v, t0, fr });
    }
    hideDot(); dark(false);
    const out = analyzePursuitSeries(segs.map(s => ({ k: s.k, v: s.v, t0: s.t0, fr: series(s.fr) })));
    out.gate = g; out.fps = fpsOf(segs.flatMap(s => s.fr), PT * PC * PUR.length);
    RUN.pursuit = out; judge();
    if (!out.ok) return fail(stepPursuit, '目が見えている時間が短すぎました');
    staff(pursuitHTML(out));
    recorded(stepPursuit, stepSacc, '次へ（跳ぶ点を見る）');
  });
}
// 追従の採点：点が速く動いている所（最高の速さの半分以上）だけを使い、点の向きごとに
// ・ついていけた割合（目の速さ ÷ 点の速さ。1＝ぴったり）・途中で跳んで追いついた割合・位置のずれ を出す
function analyzePursuitSeries(segs) {
  const bins = {}, add = (b, o) => (bins[b] = bins[b] || []).push(o);
  let used = 0, total = 0;
  for (const s of segs) {
    const fr = s.fr.filter(f => !f.bl && Number.isFinite(f.X) && Number.isFinite(f.Y)); total += s.fr.length; used += fr.length;
    if (fr.length < 20) continue;
    const w = 2 * Math.PI / PT, vpk = Math.hypot(...s.v) * w * 1000;
    const T = t => { const a = Math.sin(w * (t - s.t0)); return { x: s.v[0] * a, y: s.v[1] * a }; };
    const VT = t => { const c = Math.cos(w * (t - s.t0)) * w * 1000; return { x: s.v[0] * c, y: s.v[1] * c }; };
    const ox = med(fr.map(f => f.X - T(f.t).x)), oy = med(fr.map(f => f.Y - T(f.t).y));
    for (let i = 2; i < fr.length - 2; i++) {
      const win = fr.slice(i - 2, i + 3); if (win[4].t - win[0].t > 260) continue;   // まばたきで抜けた所をまたがない
      const vt = VT(fr[i].t), sp = Math.hypot(vt.x, vt.y); if (sp < 0.5 * vpk) continue;
      const ve = velOf(win), u = { x: vt.x / sp, y: vt.y / sp };
      const along = (ve.x * u.x + ve.y * u.y) / sp, sac = Math.hypot(ve.x, ve.y) > 2.5 * vpk;
      const tp = T(fr[i].t);
      add(dirOf(u.x, u.y), { along, sac, err: Math.hypot(fr[i].X - ox - tp.x, fr[i].Y - oy - tp.y) });

}

function pursuitHTML(o) {
  const d = o.dir, cell = k => d[k] ? `${DJ[k]} <b>${d[k].q}</b>（${f2(d[k].gain)}・跳び${Math.round(d[k].sacc * 100)}%）` : `${DJ[k]} —`;
  return `追従の点数（向きごと。100＝ぴったり）<br>${DIRS.map(cell).join('<br>')}<br><span class="small">（ ）＝目の速さ÷点の速さ・追いつくために跳んだ割合。まばたき等で除いたコマ ${Math.round(o.blinkFrac * 100)}%・${o.fps}コマ/秒</span>${judgeHTML()}`;
}
// 内部の判定（お客さんには見せない）。しきい値は仮（2026-10-14 宮崎さん：判定のしかたは後で伝える）
// ・右／右上／右下へ ついていけない（カクつく）→ 右の皮質　・左／左上／左下 → 左の皮質（同側の皮質。アドバンス教材 §7.1 で確定 2026-10-14）
// ・上下（上・下）だけ ついていけない → 中脳（2026-10-14 宮崎さん確定）。左右より JTH 以上低いとき
// ・点を見つめる：揺れ・外れ（スクエアウェーブジャーク）が多い → 小脳虫部（両側）（2026-10-14 宮崎さん確定）。ほかの検査の小脳・前庭の所見は加算材料として見立てで数える
const JTH = 15, FIX_SD = 0.08, FIX_INT = 3;   // 見つめる：揺れ（よこ・たての大きい方）・外れた回数のしきい値（仮）

function judge() {
  const J = [], d = RUN.pursuit && RUN.pursuit.dir;
  for (const H of [RUN.eightJudge, RUN.neckJudge]) if (H) {
    if (H.overall) J.push({ k: '小脳虫部・前庭機能', why: H.overall });
    for (const c of H.canals) J.push({ k: `${c.k}（→ ${c.cb}）`, why: c.why });

    if (qR != null && qL != null) {
      if (qL - qR >= JTH) J.push({ k: '右の皮質', why: `右方向（右・右上・右下）の追従 ${qR} が、左方向 ${qL} より ${qL - qR} 低い` });
      if (qR - qL >= JTH) J.push({ k: '左の皮質', why: `左方向（左・左上・左下）の追従 ${qL} が、右方向 ${qR} より ${qR - qL} 低い` });
    }
    if (qV != null && qH != null && qH - qV >= JTH) J.push({ k: '中脳', why: `上下の追従 ${qV} が、左右 ${qH} より ${qH - qV} 低い` });

}
function judgeHTML() {
  const J = RUN.judge || [];
  const G = RUN.pursuitGroups, ud = G && G.vertical != null ? `<br><span class="small">追従の上下 ${G.vertical}・左右 ${G.horizontal}（上下が左右より ${JTH} 以上低い → 中脳）</span>` : '';
  return `<div class="res judge">内部の判定（仮・お客さんには出ない）：${J.length ? J.map(j => `<br><b>${j.k}</b>の働き低下の可能性 — ${j.why}`).join('') : '<br>目立った差なし'}${RUN.judgeNote ? '<br>※' + RUN.judgeNote : ''}${ud}</div>`;
}

// ════ 5. サッカード（跳ぶ点を見る）：8方向へ跳んで、真ん中へ戻る。間はばらばら（1.0〜1.6秒）にして先読みを防ぐ
async function stepSacc() {
  show(7, '7. 跳ぶ点を見る');
  cue('点がパッと跳びます<br>跳んだら<b>すぐに目だけで</b><br>その点を見てください<small>頭は動かさずに。約25秒</small>');
  btn('始める', async () => {
    const my = tok; clearBtns();
    const g = await eyeStepStart(stepSacc); if (!g) return;
    dark(true); placeDot(0, 0); cue('真ん中の点を見て', 'low'); await sleep(1600); cue('');
    const dirs = [...DIRS].sort(() => Math.random() - 0.5), jumps = []; let cur = [0, 0];
    rec = []; const t0 = performance.now();
    for (const k of dirs) {
      if (my !== tok) { rec = null; return; }
      const to = DV[k].map(v => v * 0.85);
      await sleep(1000 + Math.random() * 600); placeDot(...to); jumps.push({ t: performance.now(), from: cur, to }); cur = to;
      await sleep(1000 + Math.random() * 600); placeDot(0, 0); jumps.push({ t: performance.now(), from: cur, to: [0, 0] }); cur = [0, 0];
    }
    await sleep(900); const fr = rec; rec = null; hideDot(); dark(false);
    const out = analyzeSaccSeries(series(fr), jumps);
    out.gate = g; out.fps = fpsOf(fr, performance.now() - t0);
    RUN.saccade = out;

// 舌の先を探す：口の下の範囲で、頬の肌より赤い所をつなげ、いちばん下の帯の真ん中を舌の先とする。

  for (const k of [205, 425, 50, 280, 136, 365, 172, 397]) { const q = f(pts[k]); for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const v = pix({ x: q.x + i * 0.015, y: q.y + j * 0.015 }); if (v) sk.push(ch(v)); } }

}

  const out = res.filter(x => x.o.prot > 0.12 && x.o.n > 30 && x.o.gap > TONGUE_GAP);

}
function drawTongue(fr, o) {
  const c = $('photo'), w = fr.img.width, h = fr.img.height; c.width = w; c.height = h; const x = c.getContext('2d');

// ════ 見立て（スタッフの画面だけ。読み方もしきい値も仮。2026-10-14 宮崎さん）

// ・首が傾いている側 → その側の前庭器官

// ・見つめる検査の揺れ＝小脳虫部（両側）。ほかの検査の小脳・前庭の所見（半規管・サッカードの小脳・首の傾き・8の字の気持ち悪さ）は加算材料

  if (M.vest) L.push(`<b>${M.vest.side}の前庭器官</b> — ${M.vest.why}`);
  const nz = RUN.eight && RUN.eight.nausea; if (nz && nz !== 'いいえ') { M.nausea = nz; L.push(`<b>前庭</b>の問題を疑う — 首の8の字で気持ち悪さ「${nz}」`); }
  for (const s of pmS) L.push(`<b>${s}の PMRF</b> — ${M.pmrf.filter(p => p.side === s).map(p => p.why).join('・')}`);
  if (M.pain) L.push(`<b>痛み</b>：${M.pain}`);
  // 小脳・前庭：見つめる検査（小脳虫部・両側）を軸に、ほかの検査の小脳・前庭の所見を加算材料として並べる
  const vermis = J.find(j => j.k === '小脳虫部（両側）');
  const cbv = [...new Set(J.filter(j => j !== vermis && /小脳|半規管|前庭/.test(j.k)).map(j => j.k))];
  if (M.vest) cbv.push(`${M.vest.side}の前庭器官（首の傾き）`);
  if (M.nausea) cbv.push(`前庭（8の字で気持ち悪さ「${M.nausea}」）`);
  if (vermis) L.push(`<b>小脳虫部（両側）</b>の働き低下 — ${vermis.why}${cbv.length ? `<br>　加算材料（ほかの検査の小脳・前庭の所見 ${cbv.length}件）：${cbv.join('・')}` : '（ほかの検査に小脳・前庭の所見なし）'}`);
  else if (cbv.length) L.push(`<b>小脳・前庭</b>：${[...new Set(cbv)].join('・')}（首の検査・サッカードから）`);
  // 重なり：同じ所に何件の所見が重なったか（多い順）
  const O = {}, add = (k, src) => (O[k] = O[k] || []).push(src);
  for (const j of J) { const m = j.k.match(/^(右|左)の皮質/); if (m) add(`${m[1]}の皮質`, j.src || (/追従/.test(j.why) ? '点を目で追う' : '眼球運動')); }
  for (const c of cn) if (cortex && c.side === cortex) add(`${cortex}の皮質`, `${c.side}の${c.n.replace('（中脳）', '')}`);
  if (mb) add('中脳', '上下の追従');
  for (const c of cn) if (/中脳/.test(c.n) && !(cortex && c.side === cortex)) add('中脳', `${c.side}の動眼神経（${c.why}）`);
  if (vermis || cbv.length) { if (vermis) add('小脳虫部・前庭', '見つめる検査'); for (const k of cbv) add('小脳虫部・前庭', k); }
  for (const s of pmS) for (const p of M.pmrf.filter(p => p.side === s)) add(`${s}の PMRF`, p.why);
  const OL = Object.entries(O).sort((a, b) => b[1].length - a[1].length);
  M.overlap = OL.map(([k, v]) => ({ k, n: v.length, from: v }));
  if (OL.length) L.unshift(`<b>重なり</b>（多い順）：${OL.map(([k, v]) => `${k} ${v.length}件`).join('／')}`);
  RUN.mitate = { cortex: cx, cn: cn.map(({ n, side, why, read }) => ({ n, side, why, read })), vest: M.vest, nausea: M.nausea || null, midbrain: !!mb, overlap: M.overlap, pmrf: M.pmrf, pain: M.pain && M.pain.replace(/<\/?b>/g, ''), lines: L.map(x => x.replace(/<\/?b>/g, '')) };
  return L;
}
function mitateHTML() {
  const L = mitate();
  return `<div class="res judge">見立て（仮・お客さんには出ない）：${L.map(x => '<br>・' + x).join('')}<br><span class="small">脳神経と皮質の側が同じ＝その側の皮質、逆＝脳神経の問題。痛みが出やすい側＝その側の PMRF。動眼神経＝中脳、寄り目と上下の追従が両方弱い＝中脳。8の字で気持ち悪い＝前庭。見つめる検査の揺れ＝小脳虫部（両側）で、ほかの小脳・前庭の所見は加算材料。重なりが多い所ほど問題がありそうと読む</span></div>`;
}

  if (RUN.tilt) L.push(`1. ふだんの首の傾き：${Math.abs(RUN.tilt.deg) < 0.5 ? 'ほぼまっすぐ' : (RUN.tilt.deg > 0 ? '右' : '左') + 'へ' + Math.abs(RUN.tilt.deg) + '°'}（スマホの傾き ${RUN.tilt.phone ?? '—'}°）`);

  if (x && x.ok) L.push(`8. 注視：揺れ よこ${f2(x.sdX)}・たて${f2(x.sdY)}／広さ${f2(x.bcea)}／外れ${x.intrusions}回`);
  if (RUN.pupil) L.push(`9. 瞳孔÷黒目：${RUN.pupil.r0 != null ? `右${f2(RUN.pupil.r0)}・左${f2(RUN.pupil.r1)}` : '判定できず'}`);
  if (c) L.push(`9. 寄り目：右${f2(c.eyes[0].gain)}・左${f2(c.eyes[1].gain)}／先に逃げた目 ${c.first || 'なし'}`);

}
function saveRun() {

async function copyText(t, b) { let ok = false; try { await navigator.clipboard.writeText(t); ok = true; } catch (e) { const a = $('endText'); a.value = t; a.select(); try { ok = document.execCommand('copy'); } catch (_) {} } b.textContent = ok ? 'コピーしました' : '上の枠を長押しでコピー'; }

  $('sIntro').classList.add('hide'); $('sMain').classList.remove('hide');
