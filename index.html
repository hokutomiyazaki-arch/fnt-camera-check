<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カメラでチェック（試し版）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0f1115;color:#f2f2f2;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:6px 0}
p{margin:6px 0;font-size:15px}
.small{font-size:12.5px;color:#aab}
button{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;padding:14px;width:100%;margin:5px 0;background:#2a6df4;color:#fff;cursor:pointer}
button.sub{background:#2b2f38}
button:disabled{opacity:.4}
.res{background:#1b1f27;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.res b{color:#ffd166}
.judge{background:#3a1f24;border:1px solid #ff8a65}
textarea{width:100%;height:160px;background:#1b1f27;color:#eee;border:1px solid #333;border-radius:8px;font-size:12px;padding:8px}
.hide{display:none!important}
/* テストの画面：画面いっぱい。指示はいつも真ん中に太く大きく */
#sMain{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;inset:0}
#stage video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1);transition:opacity .3s}
#stage.dark video{opacity:.10}#stage.dark #overlay{opacity:0}
#sMain.dark #top{opacity:.25}
#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 12px 14px;background:linear-gradient(rgba(0,0,0,.65),transparent);z-index:6;pointer-events:none}
#title{font-size:14px;font-weight:700;color:#cfd3dc}
.steps{display:flex;gap:3px;margin:0 0 4px}.steps span{flex:1;height:4px;border-radius:2px;background:#2b2f38}.steps span.on{background:#2a6df4}
#cue{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);text-align:center;font-weight:800;font-size:clamp(23px,6.6vw,34px);line-height:1.45;padding:16px 16px;border-radius:18px;background:rgba(0,0,0,.62);text-shadow:0 2px 8px #000;pointer-events:none;z-index:5}
#cue:empty{display:none}
#cue.thin{background:none}
#cue.low{top:68%}
#cue.huge{font-size:clamp(60px,22vw,110px)}
#cue small{display:block;font-size:16px;font-weight:600;color:#dfe3ea;margin-top:8px;line-height:1.5}
#cue .ok{display:inline-block;color:#5ad18b;font-size:1.5em}
.meter{position:relative;height:16px;border-radius:8px;background:#2b2f38;margin:12px 4px 2px;overflow:hidden}
.meter i{position:absolute;top:0;bottom:0;background:rgba(90,209,139,.45)}
.meter b{position:absolute;top:-2px;width:6px;height:20px;margin-left:-3px;background:#fff;border-radius:3px}
.tgt{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#ffcc00;box-shadow:0 0 14px #ffcc00;display:none;pointer-events:none;z-index:7}
.tgt.fix{width:22px;height:22px;margin:-11px 0 0 -11px;background:radial-gradient(#000 0 22%,#ffcc00 24%)}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75) 30%);z-index:8;max-height:62vh;overflow:auto}
#bottom:not(:has(*:not(:empty))){background:none}
#msg{font-size:12.5px;color:#aab;text-align:center;min-height:0}
#photoWrap{position:absolute;inset:0;display:none;z-index:4;background:#000}
#photo{width:100%;height:100%;object-fit:contain}
.badge{position:fixed;right:8px;top:calc(6px + env(safe-area-inset-top));font-size:11px;background:#7a3cff;color:#fff;border-radius:6px;padding:1px 6px;z-index:20}
</style>
</head>
<body>
<main>
<div id="sIntro">
  <h1>カメラでチェック（試し版）</h1>
  <p>カメラで顔と目の動きを読み取ります。画面の真ん中に出る指示のとおりに、顔や目を動かしてください。</p>
  <div class="res small">
    ・映像も写真も、この端末の外へは送りません（端末の中で数字にするだけです）。<br>
    ・医療の検査ではありません。痛み・めまい・気分の悪さが出たら、すぐにやめてください。<br>
    ・明るい所でやってください。目のチェックでは、スマホを顔に近づけて持ちます。
  </div>
  <p id="loadState" class="small">読み込み中…</p>
  <button id="bStart" disabled>カメラを起動する</button>
</div>

<div id="sEnd" class="hide">
  <h1>おつかれさまでした</h1>
  <p id="endLead">すべてのチェックが終わりました。</p>
  <div id="endList"></div>
  <div id="staffEnd" class="hide">
    <p class="small">ここから下はスタッフ用です（お客さんの画面には出ません）。下の［コピー］で記録をそのままチャットに貼れます。</p>
    <textarea id="endText" readonly></textarea>
    <button id="bCopy">コピー</button>
    <button class="sub" id="bCopyAll">この端末に残っている記録を全部コピー</button>
  </div>
  <button class="sub" id="bAgain">最初からもう一度</button>
</div>
</main>

<div id="sMain" class="hide">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <canvas id="guide"></canvas>
    <div id="photoWrap"><canvas id="photo"></canvas></div>
    <div class="tgt" id="dot"></div>
  </div>
  <div id="top"><div class="steps" id="steps"></div><div id="title"></div></div>
  <div id="cue"></div>
  <div id="bottom"><div id="result"></div><div id="btns"></div><div id="msg"></div></div>
</div>

<script type="module">
import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/vision_bundle.mjs';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = id => document.getElementById(id);
const video = $('video'), ov = $('overlay'), oc = ov.getContext('2d'), gd = $('guide'), gc = gd.getContext('2d');
let lm = null, last = null, lastBs = null, lastT = -1, rec = null, grab = null;   // last = 直近の顔の点（画素）
const sleep = ms => new Promise(r => setTimeout(r, ms));
// スタッフ表示（?staff=1）：判定と数字を出す。お客さんの画面（ふつうの URL）には判定も数字も出さず、記録だけ残す（2026-10-14 宮崎さん）
const STAFF = /[?&]staff\b/.test(location.search);
if (STAFF) document.body.insertAdjacentHTML('beforeend', '<div class="badge">スタッフ表示</div>');
let RUN = {};                                       // この回の記録（内部用）。最後に端末へ保存する
const newRun = () => { RUN = { v: 2, started: new Date().toISOString(), ua: navigator.userAgent }; };
newRun();

// ── 顔の点の番号（右・左は本人から見た向き。起動後に実際の位置で確かめて入れ替える）
let P = { eyeOut: [33, 263], eyeIn: [133, 362], mouth: [61, 291], brow: [105, 334], lidUp: [159, 386], lidDn: [145, 374], iris: [468, 473], cheek: [234, 454] };
let sideChecked = false;
const BSN = ['eyeLookInLeft', 'eyeLookOutLeft', 'eyeLookUpLeft', 'eyeLookDownLeft', 'eyeLookInRight', 'eyeLookOutRight', 'eyeLookUpRight', 'eyeLookDownRight', 'eyeBlinkLeft', 'eyeBlinkRight', 'jawOpen', 'tongueOut'];
// GPU で顔の点が取れない端末がある（Android の Chrome で、顔が映っていても点が出なかった）。取れない・エラーが続いたら CPU に切り替える
let delegate = '', toCPU = async () => {}, switching = false, gpuMiss = 0;

async function load() {
  const fs = await FilesetResolver.forVisionTasks(WASM);
  const opt = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true });
  try { lm = await FaceLandmarker.createFromOptions(fs, opt('GPU')); delegate = 'GPU'; }
  catch (e) { lm = await FaceLandmarker.createFromOptions(fs, opt('CPU')); delegate = 'CPU'; }
  toCPU = async () => { if (delegate === 'CPU' || switching) return; switching = true; try { lm = await FaceLandmarker.createFromOptions(fs, opt('CPU')); delegate = 'CPU'; } finally { switching = false; } };
  window.__lm = lm;
  $('loadState').textContent = '準備ができました。';
  $('bStart').disabled = false;
}
load().catch(e => { $('loadState').textContent = '読み込みに失敗しました：' + e.message; window.__loadError = e.message; });

// ── 計算の道具
function px(l) { return { x: l.x * video.videoWidth, y: l.y * video.videoHeight }; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
const med = a => { if (!a.length) return NaN; const v = [...a].sort((x, y) => x - y), n = v.length >> 1; return v.length % 2 ? v[n] : (v[n - 1] + v[n]) / 2; };
const mad = a => { const m = med(a); return med(a.map(x => Math.abs(x - m))); };
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => { const m = Math.max(Math.abs(a), Math.abs(b)); return m < 1e-6 ? 0 : Math.round(Math.abs(a - b) / m * 100); };
const f2 = v => Number.isFinite(v) ? (Math.round(v * 100) / 100).toFixed(2) : '—';
const r0 = v => Number.isFinite(v) ? Math.round(v) : null;
const r3 = v => Number.isFinite(v) ? Math.round(v * 1000) / 1000 : null;
function sideWord(r, l, big = '大きい') { if (Math.max(r, l) < 0.02) return '動きが小さく、比べられませんでした'; if (pct(r, l) < 15) return '左右ほぼ同じ'; return (r > l ? '右' : '左') + 'のほうが' + big; }

// 目の線を水平に回して、目の間の長さを1にした座標（顔の傾き・カメラとの距離に左右されない）。
// x は「本人の右 → 本人の左」が＋（写っている映像のまま。鏡にしていない）
function frame(pts) {
  const a = pts[P.eyeOut[0]], b = pts[P.eyeOut[1]];
  const c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, d = dist(a, b);
  let ang = Math.atan2(b.y - a.y, b.x - a.x);
  if (ang > Math.PI / 2) ang -= Math.PI; else if (ang < -Math.PI / 2) ang += Math.PI;
  const cs = Math.cos(-ang), sn = Math.sin(-ang);
  const f = p => { const x = p.x - c.x, y = p.y - c.y; return { x: (x * cs - y * sn) / d, y: (x * sn + y * cs) / d }; };
  const ci = Math.cos(ang), si = Math.sin(ang);
  const inv = q => ({ x: c.x + (q.x * ci - q.y * si) * d, y: c.y + (q.x * si + q.y * ci) * d });
  return { f, inv, d, ang, c };
}
// 目の大きさ（目じり〜目がしらの長さ）を、映像の短い辺で割った値。スマホを顔に近づけるほど大きくなる
const eyeSize = pts => (dist(pts[P.eyeOut[0]], pts[P.eyeIn[0]]) + dist(pts[P.eyeOut[1]], pts[P.eyeIn[1]])) / 2 / Math.min(video.videoWidth, video.videoHeight);
const EYE_OK = [0.13, 0.20];   // 目のチェックで「OK」とする目の大きさ（仮。宮崎さんの端末の記録で詰める）

// ── カメラ
async function startCam() {
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
  video.srcObject = s;
  await video.play();
  RUN.cam = { w: video.videoWidth, h: video.videoHeight, fpsSetting: s.getVideoTracks()[0]?.getSettings?.().frameRate || null };
  loop();
}
const grabC = document.createElement('canvas'), grabX = grabC.getContext('2d', { willReadFrequently: true });
function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    const t = performance.now();
    let r = null;
    if (!switching) { try { r = lm.detectForVideo(video, t); } catch (e) { window.__detErr = e.message; toCPU(); } }
    const got = !!(r && r.faceLandmarks && r.faceLandmarks[0]);
    gpuMiss = got ? 0 : gpuMiss + 1;
    if (delegate === 'GPU' && gpuMiss > 45) toCPU();   // GPU で約3秒続けて顔が取れなければ、CPU に切り替える（一度だけ）
    window.__delegate = delegate;
    ov.width = video.videoWidth; ov.height = video.videoHeight;
    oc.clearRect(0, 0, ov.width, ov.height);
    if (got) {
      const pts = r.faceLandmarks[0].map(px);
      if (!sideChecked) {   // 写っている映像（鏡にしていない）では、本人の右は画面の左＝x が小さい
        if (pts[33].x > pts[263].x) for (const k in P) P[k] = [P[k][1], P[k][0]];
        sideChecked = true;
      }
      let bs = null;
      const cat = r.faceBlendshapes && r.faceBlendshapes[0] && r.faceBlendshapes[0].categories;
      if (cat) { bs = {}; for (const c of cat) if (BSN.includes(c.categoryName)) bs[c.categoryName] = c.score; }
      last = pts; lastBs = bs; window.__last = pts;
      oc.fillStyle = 'rgba(90,209,139,.9)';
      for (let i = 0; i < pts.length; i += 2) oc.fillRect(pts[i].x - 1.2, pts[i].y - 1.2, 2.4, 2.4);
      oc.fillStyle = '#ffcc00';
      for (const i of [...P.iris, 1]) { oc.beginPath(); oc.arc(pts[i].x, pts[i].y, 3.5, 0, 7); oc.fill(); }
      if (rec) rec.push({ t, pts, bs });
      if (grab && t - grab.lastT >= 200) {   // 舌：写真のコマを取っておく（端末の中だけ）
        grabC.width = video.videoWidth; grabC.height = video.videoHeight; grabX.drawImage(video, 0, 0);
        grab.fr.push({ t, pts, bs, img: grabX.getImageData(0, 0, grabC.width, grabC.height) }); grab.lastT = t;
      }
      if (G) drawGuide(t, pts);
    } else { last = null; lastBs = null; if (G) drawGuide(t, null); }
    window.__frames = (window.__frames || 0) + 1;
    window.__faceSeen = (window.__faceSeen || 0) + (last ? 1 : 0);
  }
  requestAnimationFrame(loop);
}

const bc = document.createElement('canvas'), bx = bc.getContext('2d', { willReadFrequently: true });
function brightness() {
  bc.width = 32; bc.height = 24; bx.drawImage(video, 0, 0, 32, 24);
  const d = bx.getImageData(8, 4, 16, 16).data; let s = 0;
  for (let i = 0; i < d.length; i += 4) s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  return s / (d.length / 4);
}

// ── 画面の部品
const NSTEP = 9;
$('steps').innerHTML = '<span></span>'.repeat(NSTEP);
let tok = 0;                       // 段を移ったら増える（前の段の待ちを止めるため）
function show(step, title) {
  tok++;
  [...$('steps').children].forEach((e, i) => e.classList.toggle('on', i <= step));
  $('title').textContent = title;
  $('result').innerHTML = ''; $('btns').innerHTML = ''; $('msg').textContent = ''; cue('');
  $('photoWrap').style.display = 'none'; dark(false); hideDot();
  gc.clearRect(0, 0, gd.width, gd.height);
  G = null; rec = null; grab = null;
  return tok;
}
// 指示は画面の真ん中に太く大きく出す（2026-10-14 宮崎さん「常に画面の真ん中に指示が出て、その通りに目や顔を動かす」）
function cue(html, cls = '') { const c = $('cue'); c.className = cls; c.innerHTML = html; }
function dark(on) { $('stage').classList.toggle('dark', on); $('sMain').classList.toggle('dark', on); }
function btn(label, fn, cls = '') { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = fn; $('btns').appendChild(b); return b; }
const clearBtns = () => { $('btns').innerHTML = ''; $('result').innerHTML = ''; };
function staff(html) { $('result').innerHTML = STAFF ? `<div class="res">${html}</div>` : ''; }
const calWarn = () => CAL && !CAL.reliable ? '<br><span style="color:#ff8a65">※目の合わせが不安定なので、この数字は信用しない</span>' : '';
async function countdown(n = 3, pre = '') { for (let i = n; i > 0; i--) { cue(pre ? `${pre}<br><span style="font-size:1.8em">${i}</span>` : String(i), pre ? '' : 'huge'); await sleep(800); } cue(''); }
async function record(ms, onTick) {
  rec = []; const t0 = performance.now();
  while (performance.now() - t0 < ms) { if (onTick) onTick((performance.now() - t0) / ms); await sleep(16); }
  const r = rec; rec = null; return r;
}
const fpsOf = (r, ms) => Math.round(r.length / (ms / 1000));
function fail(again, why) {
  cue(`${why}<small>顔を画面に入れて、もう一度どうぞ</small>`);
  if (STAFF) staff(`<span class="small">確かめ用：顔の点の読み取り ${delegate}・${window.__faceSeen || 0}／${window.__frames || 0}コマ${window.__detErr ? '・' + window.__detErr : ''}</span>`);
  btn('もう一度', again);
}
// お客さんの画面：判定も数字も出さず「記録しました」だけ
function recorded(again, next, nextLabel) { if (!STAFF) cue('記録しました'); btn('もう一度', again, 'sub'); btn(nextLabel, next); }

// ── 目の的（点）。画面の座標：x は −1（左）〜 +1（右）、y は −1（下）〜 +1（上）。右・左は画面を見ている本人の右・左
const dot = $('dot');
function placeDot(x, y, cls = '') { const st = $('stage'); dot.className = 'tgt ' + cls; dot.style.display = 'block'; dot.style.left = (st.clientWidth * (0.5 + 0.40 * x)) + 'px'; dot.style.top = (st.clientHeight * (0.47 - 0.33 * y)) + 'px'; }
function hideDot() { dot.style.display = 'none'; }
const DIRS = ['R', 'UR', 'U', 'UL', 'L', 'DL', 'D', 'DR'];
const DJ = { R: '右', UR: '右上', U: '上', UL: '左上', L: '左', DL: '左下', D: '下', DR: '右下' };
const DV = { R: [1, 0], UR: [1, 1], U: [0, 1], UL: [-1, 1], L: [-1, 0], DL: [-1, -1], D: [0, -1], DR: [1, -1] };
const dirOf = (x, y) => DIRS[((Math.round(Math.atan2(y, x) * 180 / Math.PI / 45) % 8) + 8) % 8];

// ════ 0. 位置合わせ
async function stepAlign() {
  const my = show(0, '最初に：顔の位置を合わせる');
  const b = btn('次へ（首の8の字）', stepEight); b.disabled = true;
  const skip = btn('このまま進む', stepEight, 'sub'); skip.style.display = 'none';
  const t0 = performance.now();
  let okCount = 0, unlocked = false;
  while (my === tok) {
    const items = [];
    if (!last) items.push(['顔が見つかりません。カメラに顔を向けてください', false]);
    else {
      const { d, f, ang } = frame(last), w = video.videoWidth;
      const nose = last[1], cl = last[P.cheek[0]], cr = last[P.cheek[1]];
      const yaw = (f(nose).x - f(cl).x) / (f(cr).x - f(cl).x);   // 0.5 で正面。傾きを戻した座標で取る
      const roll = Math.abs(ang * 180 / Math.PI), size = d / w;
      items.push([size < 0.10 ? 'もう少し近づいて' : size > 0.50 ? 'もう少し離れて' : '距離：ちょうどいい', size >= 0.10 && size <= 0.50]);
      const yOk = Math.abs(yaw - 0.5) <= 0.12, rOk = roll <= 12;
      items.push([yOk && rOk ? '向き：まっすぐ' : !yOk ? '顔をまっすぐ正面に' : '首のかしげをまっすぐに', yOk && rOk]);
      const br = brightness();
      items.push([br < 45 ? '暗いです。明るい所へ' : '明るさ：OK', br >= 45]);
    }
    const all = items.length === 3 && items.every(i => i[1]);
    okCount = all ? okCount + 1 : Math.max(0, okCount - 1);
    if (okCount >= 5) unlocked = true;                          // 一度そろえば、次へは押せたままにする
    b.disabled = !unlocked;
    skip.style.display = !unlocked && last && performance.now() - t0 > 5000 ? '' : 'none';   // 顔が写っていないときは出さない
    const head = all || unlocked ? '<span class="ok">OK ✓</span><br>下の「次へ」を押してください' : '顔の位置を合わせます';
    cue(`${head}<small>${items.map(([t, ok]) => `<span style="color:${ok ? '#5ad18b' : '#ff8a65'}">${ok ? '●' : '○'} ${t}</span>`).join('<br>')}</small>`);
    await sleep(150);
  }
}

// ════ 1. 首の8の字（画面の ∞ のガイドを、鼻先でなぞる）
// ガイド：横向きの ∞（x＝sinθ・y＝sin2θ）。1周 5秒で3周 → 反対回りで3周。
const LAP = 5000, LAPS = 3, GA = 0.6, GB = 0.3;   // 横の半幅・縦の半幅（d を1として）
let G = null;                                      // 描いている最中のガイド { cx, cy, d, t0, dir, trail }
const gPos = (g, th) => ({ x: g.cx - g.dir0 * GA * g.d * Math.sin(th), y: g.cy - GB * g.d * Math.sin(2 * th) });   // dir0=1：画面の右上へ出る
function drawGuide(t, pts) {
  const g = G; oc.lineWidth = Math.max(3, g.d * 0.05);

function analyzeEight(seg, g) {

  const TOL = 0.15, TOLF = 0.2;

    for (let lag = 0; lag <= 1200; lag += 100) { const gp = sub.map(r => at(r, lag));

    const fb = fits[s.k], rs = rows.filter(r => r.s === s), n = rs.map(r => ({ x: r.n.x + fb.ox, y: r.n.y + fb.oy }));
    const on = rs.filter((r, i) => dist(at(r, fb.lag), n[i]) / g.d < TOLF).length;
    const cov = side => { const cs = curve.filter(c => side * (g.cx - c.x) > 1e-6); const hit = cs.filter(c => n.some(p => dist(c, p) / g.d < TOL)).length; return cs.length ? Math.round(hit / cs.length * 100) : 0; };
    const xs = n.map(p => (g.cx - p.x) / (GA * g.d));
    out[s.k] = { lag: fb.lag, n: rs.length, follow: rs.length ? Math.round(on / rs.length * 100) : 0, covR: cov(1), covL: cov(-1), wR: r3(Math.max(0, ...xs)), wL: r3(Math.max(0, ...xs.map(v => -v))) };
  }

    gc.lineWidth = 6; gc.strokeStyle = 'rgba(255,255,255,.6)'; gc.setLineDash([14, 10]); gc.beginPath();

    gc.lineWidth = 4;
    for (const s of seg) for (let i = 1; i < s.r.length; i++) {
      const a = T(s.r[i - 1].pts[1], 1), b = T(s.r[i].pts[1], 1);
      gc.strokeStyle = near(s.r[i].pts[1]) < TOL ? (s.dir > 0 ? '#5ad18b' : '#4fc3f7') : '#ff6b6b';
      gc.beginPath(); gc.moveTo(a.x, a.y); gc.lineTo(b.x, b.y); gc.stroke();
    }
    staff(`点について線の上：最初 <b>${F.follow}%</b>・反対 <b>${B.follow}%</b><br>なぞれた範囲 右の輪：<b>${F.covR}%</b>・<b>${B.covR}%</b>　左の輪：<b>${F.covL}%</b>・<b>${B.covL}%</b><br>届いた横幅 右 <b>${f2(Math.max(F.wR, B.wR))}</b>・左 <b>${f2(Math.max(F.wL, B.wL))}</b><br><span class="small">緑＝最初の向き・水色＝反対回りで線の上、赤＝外れ。遅れ ${(F.lag / 1000).toFixed(1)}／${(B.lag / 1000).toFixed(1)}秒。${F.n + B.n}コマ</span>`);
  }

}

function analyzeFace(seg) {
  if (seg.base.length < 8 || seg.smile.length < 8) return fail(stepFace, '顔が見えている時間が短すぎました');
  const avg = (arr, fn) => arr.reduce((s, x) => s + fn(x), 0) / arr.length;
  const F = ({ pts }) => frame(pts).f;
  const cornerY = (fr, s) => F(fr)(fr.pts[P.mouth[s]]).y;
  const browY = (fr, s) => F(fr)(fr.pts[P.brow[s]]).y;
  const lid = (fr, s) => { const f = F(fr); return f(fr.pts[P.lidDn[s]]).y - f(fr.pts[P.lidUp[s]]).y; };
  const res = {};
  for (const s of [0, 1]) {
    const b = avg(seg.base, fr => cornerY(fr, s));
    res['m' + s] = r3(b - Math.min(...seg.smile.map(fr => cornerY(fr, s))));
    const bb = avg(seg.base, fr => browY(fr, s));
    res['b' + s] = r3(seg.brow.length ? bb - Math.min(...seg.brow.map(fr => browY(fr, s))) : 0);
    const lb = avg(seg.base, fr => lid(fr, s));
    res['e' + s] = r3(seg.eye.length && lb > 0 ? Math.max(0, 1 - Math.min(...seg.eye.map(fr => lid(fr, s))) / lb) : 0);
  }
  RUN.face = res;
  staff(`口角の上がり：右 <b>${f2(res.m0)}</b>・左 <b>${f2(res.m1)}</b> → ${sideWord(res.m0, res.m1, 'よく上がる')}（差 ${pct(res.m0, res.m1)}%）<br>
  眉の上がり：右 <b>${f2(res.b0)}</b>・左 <b>${f2(res.b1)}</b> → ${sideWord(res.b0, res.b1, 'よく上がる')}（差 ${pct(res.b0, res.b1)}%）<br>
  目の閉じ方：右 <b>${Math.round(res.e0 * 100)}%</b>・左 <b>${Math.round(res.e1 * 100)}%</b> → ${sideWord(res.e0, res.e1, 'よく閉じる')}`);
  recorded(stepFace, stepEyePrep, '次へ（目の準備）');
}

// ════ 目のチェックの共通部品
// 近さの確認：目がどれだけ大きく映っているかで判定し、ちょうどいい近さで「OK ✓」を出す（2026-10-14 宮崎さん）

      const lo = 0.04, hi = 0.26, pos = clamp((v - lo) / (hi - lo), 0, 1) * 100;
      const zone = `<div class="meter"><i style="left:${(EYE_OK[0] - lo) / (hi - lo) * 100}%;width:${(EYE_OK[1] - EYE_OK[0]) / (hi - lo) * 100}%"></i><b style="left:${pos}%"></b></div>`;
      html = (good ? '<span class="ok">OK ✓</span><br>この近さのまま' : v < EYE_OK[0] ? 'スマホを<br>顔に近づけて' : '少し<br>離して') + zone +
        '<small>目が大きく映るまで近づけます（目安：顔から20〜25cm）。緑の帯に白い線が入ればOK</small>';

  }

}
// 1コマから目の特徴を取る。右目（s=0）・左目（s=1）は本人の向き
function eyeFeat(pts) {
  const { f } = frame(pts), o = {};
  for (const s of [0, 1]) {
    const a = f(pts[P.eyeOut[s]]), b = f(pts[P.eyeIn[s]]), c = f(pts[P.iris[s]]), w = dist(a, b), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    o['hx' + s] = (c.x - m.x) / w;   // ＋＝本人の左へ
    o['vy' + s] = (c.y - m.y) / w;   // ＋＝下へ
    o['ap' + s] = (f(pts[P.lidDn[s]]).y - f(pts[P.lidUp[s]]).y) / w;
  }

}
function feats({ pts, bs }) {
  const e = eyeFeat(pts), b = k => (bs && Number.isFinite(bs[k])) ? bs[k] : NaN;
  return {
    hx: -(e.hx0 + e.hx1) / 2,                                                                                      // ＋＝本人の右を見る
    bsX: (b('eyeLookOutRight') + b('eyeLookInLeft') - b('eyeLookInRight') - b('eyeLookOutLeft')) / 2,
    vy: -(e.vy0 + e.vy1) / 2,                                                                                      // ＋＝上を見る
    ap: (e.ap0 + e.ap1) / 2,
    bsY: (b('eyeLookUpLeft') + b('eyeLookUpRight') - b('eyeLookDownLeft') - b('eyeLookDownRight')) / 2,

}
// 目の合わせ（5か所の点を見る）：一人ひとりの「黒目の位置 → 画面のどこを見ているか」の換算を作る。
// 横・たてそれぞれ、いちばん見分けがつく特徴（黒目の位置／まぶたの開き／MediaPipe の視線の値）を選ぶ
let CAL = null;
const CAL_MIN = 2;

  return fr.map(o => {

async function calibrate() {
  const my = tok; dark(true);
  cue('出てくる点を<br><b>目だけで</b>見てください<small>頭は動かさずに。点が5か所に出ます</small>'); await sleep(2600); cue('');
  const segs = [];
  for (const [k, x, y] of [['C', 0, 0], ['R', 1, 0], ['L', -1, 0], ['U', 0, 1], ['D', 0, -1], ['C2', 0, 0]]) {
    if (my !== tok) return null;

  }
  hideDot();
  const c = fitCalib(segs);

  const mt = mean(w.map(o => o.t)), mx = mean(w.map(o => o.X)), my = mean(w.map(o => o.Y)); let sxx = 0, sx = 0, sy = 0;
  w.forEach(o => { const dt = o.t - mt; sxx += dt * dt; sx += dt * (o.X - mx); sy += dt * (o.Y - my); });

  const g = await gate(); if (!g) return null;
  if (!CAL || !CAL.ok) { CAL = await calibrate(); if (!CAL) return null; if (!CAL.ok) { fail(again, '目の位置を読み取れませんでした'); return null; } }
  return g;
}

// ════ 4. 追従（スムーズパースート）：よこ・たて・ななめ2つ。1往復 3.2秒 × 2往復
const PT = 3200, PC = 2;
const PUR = [{ k: 'よこ', v: [1, 0] }, { k: 'たて', v: [0, 1] }, { k: 'ななめ（右上↔左下）', v: [1, 1] }, { k: 'ななめ（左上↔右下）', v: [-1, 1] }];

  btn('始める', async () => {
    const my = tok; clearBtns();
    const g = await eyeStepStart(stepPursuit); if (!g) return;
    dark(true); const segs = [];
    for (const s of PUR) {

      const t0 = performance.now();

  });

// 追従の採点：点が速く動いている所（最高の速さの半分以上）だけを使い、点の向きごとに

// 跳ぶたびに：動き出すまでの時間（反応）・動いている時間・いちばん速い速さ・届いた割合（1＝ぴったり）

// ════ 7. 寄り目：画面の上（カメラのすぐ下）に出した点を見たまま、スマホを鼻先へ近づける

// 舌の先を探す：口の下の範囲で、頬の肌より赤い所をつなげ、いちばん下の帯の真ん中を舌の先とする。
// 顔の中心線は眉間（168）と上くちびるの真ん中（0）を通る線（あごは舌と一緒に動くので使わない）
function tongueFrame({ pts, img }) {
  const { f, inv } = frame(pts), W = img.width, H = img.height, D = img.data;
  const pix = q => { const p = inv(q), x = Math.round(p.x), y = Math.round(p.y); if (x < 0 || y < 0 || x >= W || y >= H) return null; const i = (y * W + x) * 4; return [D[i], D[i + 1], D[i + 2]]; };

  const sk = [];
  // 肌の色の基準：頬と、口の高さのあごの横（照明で顔の下ほど赤い時にも合うように）
  for (const k of [205, 425, 50, 280, 136, 365, 172, 397]) { const q = f(pts[k]); for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const v = pix({ x: q.x + i * 0.015, y: q.y + j * 0.015 }); if (v) sk.push(ch(v)); } }

  const st = 0.012, x0 = Math.min(mR.x, mL.x) - 0.25, x1 = Math.max(mR.x, mL.x) + 0.25, y0 = up.y, y1 = Math.max(chin.y, lipB.y + 0.5) + 0.15;

    if (c.g < skin.g - 0.010 && c.r > skin.r - 0.03 && c.l > skin.l * 0.3) M[j * nx + i] = 1;   // 舌・くちびるは肌より緑が少ない（ピンク寄り）。明るさで口の中の暗い所を除く

  const lo = f(pts[14]); let seed = -1, bd = Infinity;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) if (M[j * nx + i]) { const x = x0 + i * st, y = y0 + j * st, dd = Math.hypot(x - midX(lo.y), y - (lo.y + 0.05)); if (dd < bd) { bd = dd; seed = j * nx + i; } }

    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= nx || b >= ny) continue; const k = b * nx + a; if (M[k] && !seen[k]) { seen[k] = 1; q.push(k); } } }
  const cells = comp.map(c => ({ x: x0 + (c % nx) * st, y: y0 + ((c / nx) | 0) * st }));
  // 舌の先＝口の真ん中（上下のくちびるの内側の間）からいちばん遠い所。横へ曲がった舌でも先を取れる
  const mc = { x: (up.x + lo.x) / 2, y: (up.y + lo.y) / 2 }, dm = c => Math.hypot(c.x - mc.x, c.y - mc.y);
  const far = Math.max(...cells.map(dm)), band = cells.filter(c => dm(c) >= far - 0.08);
  const tipX = mean(band.map(c => c.x)), tipY = mean(band.map(c => c.y)), below = cells.filter(c => c.y > lo.y);
  return {
    found: true, n: cells.length, gap: r3(lo.y - up.y), prot: r3(far - Math.hypot(lipB.x - mc.x, lipB.y - mc.y)), far: r3(far),
    off: r3(-(tipX - midX(tipY))),                                                  // ＋＝本人の右へ寄っている
    cenOff: below.length ? r3(-(mean(below.map(c => c.x)) - mean(below.map(c => midX(c.y))))) : null,
    tip: { x: tipX, y: tipY }, cells, midX, m168, inv,
  };
}
const TONGUE_SIDE = 0.06, TONGUE_GAP = 0.2;     // 舌の先が中心線から目の間の長さの 6% 以上ずれたら「寄っている」（仮）
function analyzeTongue(frs) {
  const res = frs.map(fr => ({ fr, o: tongueFrame(fr) })).filter(x => x.o && x.o.found);
  // 舌を出すと口が開く。口が開いていないコマは使わない（閉じた口のくちびる・あごの赤みを舌と取り違えた）
  const out = res.filter(x => x.o.prot > 0.12 && x.o.n > 30 && x.o.gap > TONGUE_GAP);
  const bsT = med(frs.map(f => f.bs && f.bs.tongueOut).filter(Number.isFinite));
  let T;
  if (out.length < 2) T = { side: '判定できず', why: '舌が見つからない', frames: frs.length, found: out.length };
  else {
    const off = med(out.map(x => x.o.off)), prot = med(out.map(x => x.o.prot));
    T = { side: off > TONGUE_SIDE ? '本人の右' : off < -TONGUE_SIDE ? '本人の左' : 'まっすぐ', off: r3(off), cenOff: r3(med(out.map(x => x.o.cenOff).filter(Number.isFinite))), prot: r3(prot), frames: frs.length, found: out.length, threshold: TONGUE_SIDE };
  }
  if (Number.isFinite(bsT)) T.bsTongueOut = r3(bsT);
  RUN.tongue = T;
  if (STAFF) {
    const best = (out.length ? out : res).sort((a, b) => (b.o.prot || 0) - (a.o.prot || 0))[0] || (frs.length ? { fr: frs[frs.length >> 1], o: null } : null);
    if (best) drawTongue(best.fr, best.o);
    staff(`舌の向き（自動）：<b>${T.side}</b>${T.off != null ? `（舌の先のずれ ${f2(T.off)}・舌全体のずれ ${f2(T.cenOff)}・出た長さ ${f2(T.prot)}）` : ''}<br><span class="small">ずれは目の間の長さを1とした値。${TONGUE_SIDE} 以上で寄っているとする（仮）。舌が見えたコマ ${T.found}／${T.frames}。写真：ピンク＝舌とみなした所・黄色の点線＝顔の中心・水色の点＝舌の先</span>`);
  }
  recorded(stepTongue, finish, '終わる');
}
function drawTongue(fr, o) {
  const c = $('photo'), w = fr.img.width, h = fr.img.height; c.width = w; c.height = h; const x = c.getContext('2d');
  x.putImageData(fr.img, 0, 0);
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').drawImage(c, 0, 0);
  x.setTransform(-1, 0, 0, 1, w, 0); x.drawImage(tmp, 0, 0); x.setTransform(1, 0, 0, 1, 0, 0);   // 鏡の向き（本人が見ている向き）に直す
  const m = p => ({ x: w - p.x, y: p.y });
  if (o && o.found) {
    x.fillStyle = 'rgba(255,0,200,.45)'; const s = Math.max(2, frame(fr.pts).d * 0.012);
    for (const cl of o.cells) { const p = m(o.inv(cl)); x.fillRect(p.x - s / 2, p.y - s / 2, s, s); }
    const a = m(o.inv({ x: o.midX(o.m168.y), y: o.m168.y })), b = m(o.inv({ x: o.midX(o.tip.y + 0.3), y: o.tip.y + 0.3 }));
    x.strokeStyle = '#ffcc00'; x.lineWidth = Math.max(2, w / 220); x.setLineDash([12, 8]); x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); x.setLineDash([]);
    const t = m(o.inv(o.tip)); x.fillStyle = '#4fc3f7'; x.beginPath(); x.arc(t.x, t.y, Math.max(5, w / 90), 0, 7); x.fill();
  }
  x.fillStyle = '#fff'; x.font = `bold ${Math.round(w / 24)}px sans-serif`;
  x.fillText('あなたの右 →', w * 0.64, h * 0.07); x.fillText('← あなたの左', w * 0.03, h * 0.07);
  $('photoWrap').style.display = 'block';
}

// ════ まとめ：記録はこの端末に残す（内部用）。お客さんには判定を見せない
function summaryLines() {
  const L = [], e = RUN.eight, f = RUN.face, p = RUN.pursuit, s = RUN.saccade, x = RUN.fixation, c = RUN.conv, t = RUN.tongue;
  if (e) L.push(`1. 首の8の字：点について線の上 最初${e.fwd.follow}%・反対${e.rev.follow}%／なぞれた範囲 右の輪 ${e.fwd.covR}%・${e.rev.covR}%／左の輪 ${e.fwd.covL}%・${e.rev.covL}%`);
  if (f) L.push(`2. 表情：口角 右${f2(f.m0)}・左${f2(f.m1)}／眉 右${f2(f.b0)}・左${f2(f.b1)}／目の閉じ 右${Math.round(f.e0 * 100)}%・左${Math.round(f.e1 * 100)}%`);
  if (RUN.calib) L.push(`3. 目の合わせ：横 ${RUN.calib.x?.nm}（見分け${RUN.calib.x?.sep}）・たて ${RUN.calib.y?.nm}（見分け${RUN.calib.y?.sep}）・近さ ${f2(RUN.eyeGate?.eye)}`);
  if (p && p.dir) L.push(`4. 追従：${DIRS.map(k => `${DJ[k]}${p.dir[k] ? p.dir[k].q : '—'}`).join('・')}`);
  if (s && s.dir) L.push(`5. サッカード（反応ms／速さ）：${DIRS.map(k => `${DJ[k]}${s.dir[k] ? `${s.dir[k].lat ?? '—'}/${f2(s.dir[k].pv)}` : '—'}`).join('・')}`);
  if (x && x.ok) L.push(`6. 注視：揺れ よこ${f2(x.sdX)}・たて${f2(x.sdY)}／広さ${f2(x.bcea)}／外れ${x.intrusions}回`);
  if (c) L.push(`7. 寄り目：右${f2(c.eyes[0].gain)}・左${f2(c.eyes[1].gain)}／先に逃げた目 ${c.first || 'なし'}`);
  if (t) L.push(`8. 舌（自動）：${t.side}${t.off != null ? `（ずれ${f2(t.off)}）` : ''}`);
  return L;
}
function saveRun() {
  try { const a = JSON.parse(localStorage.getItem('fntcc_runs') || '[]'); a.push(RUN); while (a.length > 30) a.shift(); localStorage.setItem('fntcc_runs', JSON.stringify(a)); return a.length; } catch (e) { return 0; }
}
function finish() {
  tok++; judge(); RUN.ended = new Date().toISOString(); RUN.delegate = delegate;
  const n = saveRun();
  $('sMain').classList.add('hide'); $('sEnd').classList.remove('hide');
  if (STAFF) {
    $('staffEnd').classList.remove('hide');
    $('endList').innerHTML = summaryLines().map(s => `<div class="res">${s}</div>`).join('') + judgeHTML() + `<p class="small">この端末に残っている記録：${n}件</p>`;
    $('endText').value = 'カメラでチェック（試し版）の記録\n' + summaryLines().join('\n') + '\n内部の判定（仮）：' + (RUN.judgeNote || (RUN.judge || []).map(j => j.k + '（' + j.why + '）').join('／') || '目立った差なし') + '\n\n' + JSON.stringify(RUN);
  } else { $('staffEnd').classList.add('hide'); $('endList').innerHTML = '<div class="res">記録しました。結果は担当者からお伝えします。</div>'; }
}
async function copyText(t, b) { let ok = false; try { await navigator.clipboard.writeText(t); ok = true; } catch (e) { const a = $('endText'); a.value = t; a.select(); try { ok = document.execCommand('copy'); } catch (_) {} } b.textContent = ok ? 'コピーしました' : '上の枠を長押しでコピー'; }
$('bCopy').onclick = () => copyText($('endText').value, $('bCopy'));
$('bCopyAll').onclick = () => copyText(localStorage.getItem('fntcc_runs') || '[]', $('bCopyAll'));
$('bAgain').onclick = () => { newRun(); CAL = null; $('sEnd').classList.add('hide'); $('sMain').classList.remove('hide'); stepAlign(); };

$('bStart').onclick = async () => {
  $('bStart').disabled = true;
  try { await startCam(); }
  catch (e) { $('loadState').textContent = 'カメラを起動できませんでした（' + e.name + '）。ブラウザの設定でカメラを許可してください。'; $('bStart').disabled = false; return; }
  $('sIntro').classList.add('hide'); $('sMain').classList.remove('hide');
  stepAlign();
};

window.__steps = { analyzeEight, gPos, finish, stepAlign, stepEight, stepFace, stepEyePrep, stepPursuit, stepSacc, stepFix, stepConv, stepTongue,
  analyzePursuitSeries, analyzeSaccSeries, analyzeFixSeries, analyzeTongue, tongueFrame, fitCalib, judge, get RUN() { return RUN; }, setCAL: c => { CAL = c; }, PT, DV };
